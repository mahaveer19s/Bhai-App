name: bhai_app
description: BHAI - Your Brother is Always With You. Modern Women Safety Application.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^15.1.2
  
  # Local Storage & DB
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.1
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  
  # Security & Core Utils
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Network API
  http: ^1.1.2
  
  # Maps & Location Telemetry
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  
  # Hardware & Sensor Integration
  flutter_blue_plus: ^2.3.10
  geolocator: ^13.0.2
  permission_handler: ^11.0.1
  camera: ^0.10.5+8
  record: ^6.0.0
  flutter_local_notifications: ^19.5.0
  sensors_plus: ^6.1.2
  shake: ^3.0.0
  
  # Background Services
  workmanager: ^0.7.0
  flutter_background_service: ^5.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
